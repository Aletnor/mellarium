        }
        // 单发：照抄 ChatCompletionService 的请求体（那套已验证能通），带真能掐的超时
        async function vaultSummarizeOnce(sysPrompt, srcText, cfg, token, timeoutMs, tag) {
            const base = String(cfg.apiurl).trim().replace(/\/+$/, '').replace(/\/chat\/completions$/i, '');
            const sysMsg = [String(cfg.jailbreak || '').trim(), String(sysPrompt || '').trim()].filter(Boolean).join('\n\n');
            const body = {
                stream: false,
                messages: [
                    { role: 'system', content: sysMsg },
                    { role: 'user', content: String(srcText || '') },
                ],
                model: cfg.model,
                chat_completion_source: 'openai',
                max_tokens: Number(cfg.maxTokens) > 0 ? Number(cfg.maxTokens) : 8192,
                reverse_proxy: base,
                proxy_password: cfg.key || '',
                use_sysprompt: true,
            };
            const controller = new AbortController();
            let timedOut = false;
            const timer = setTimeout(() => { timedOut = true; try { controller.abort(); } catch (e) {} }, timeoutMs);
            const t0 = Date.now();
            try {
                const resp = await fetch('/api/backends/chat-completions/generate', {
                    method: 'POST', cache: 'no-cache',
                    headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': token },
                    body: JSON.stringify(body),
                    signal: controller.signal,
                });
                let json = {};
                try { json = await resp.json(); } catch (e) { json = {}; }
                if (!resp.ok || (json && json.error)) {
                    throw new Error((json && json.error && json.error.message) || ('HTTP ' + resp.status));
                }
                const content = (json && json.choices && json.choices[0] && json.choices[0].message && json.choices[0].message.content)
                    || (json && json.content) || '';
                dlog(tag + ' 返回 耗时' + ((Date.now() - t0) / 1000).toFixed(1) + '秒 长度=' + String(content || '').length);
                return content;
            } catch (e) {
                if (timedOut) { const te = new Error('TIMEOUT'); te._to = true; throw te; }
                throw e;
            } finally {
                clearTimeout(timer);
            }
        }
        // [MP] 流式单发：健康请求几秒内开始吐字，干挂的一个字都不吐。
        //      看门狗：firstMs 内不吐第一个字，或吐字后 idleMs 没新字，就判卡死掐掉重发。
        async function vaultSummarizeStreamOnce(sysPrompt, srcText, cfg, token, firstMs, idleMs, onProgress, tag) {
            const base = String(cfg.apiurl).trim().replace(/\/+$/, '').replace(/\/chat\/completions$/i, '');
            const sysMsg = [String(cfg.jailbreak || '').trim(), String(sysPrompt || '').trim()].filter(Boolean).join('\n\n');
            const body = {
                stream: true,
                messages: [
                    { role: 'system', content: sysMsg },
                    { role: 'user', content: String(srcText || '') },
                ],
                model: cfg.model,
                chat_completion_source: 'openai',
                max_tokens: Number(cfg.maxTokens) > 0 ? Number(cfg.maxTokens) : 8192,
                reverse_proxy: base,
                proxy_password: cfg.key || '',
                use_sysprompt: true,
            };
            const controller = new AbortController();
            let got = false;
            let watchdog = setTimeout(() => { try { controller.abort(); } catch (e) {} }, firstMs); // 首字看门狗
            const rearm = () => { clearTimeout(watchdog); watchdog = setTimeout(() => { try { controller.abort(); } catch (e) {} }, idleMs); };
            const t0 = Date.now();
            let text = '';
            try {
                const resp = await fetch('/api/backends/chat-completions/generate', {
                    method: 'POST', cache: 'no-cache',
                    headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': token },
                    body: JSON.stringify(body),
                    signal: controller.signal,
                });
                if (!resp.ok) {
                    let t = ''; try { t = await resp.text(); } catch (e) {}
                    throw new Error('HTTP ' + resp.status + ' ' + String(t).slice(0, 120));
                }
                const reader = resp.body.getReader();
                const decoder = new TextDecoder();
                let buf = '';
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buf += decoder.decode(value, { stream: true });
                    let nl;
                    while ((nl = buf.indexOf('\n')) >= 0) {
                        let line = buf.slice(0, nl); buf = buf.slice(nl + 1);
                        line = line.trim();
                        if (!line || line.startsWith(':')) continue;
                        if (!line.startsWith('data:')) continue;
                        const data = line.slice(5).trim();
                        if (data === '[DONE]') continue;
                        let piece = '';
                        try {
                            const j = JSON.parse(data);
                            const ch = j.choices && j.choices[0];
                            piece = (ch && ch.delta && ch.delta.content) || (ch && ch.text) || j.content || '';
                        } catch (e) { /* 半截 JSON，忽略 */ }
                        if (piece) {
                            got = true;
                            text += piece;
                            rearm();
                            if (onProgress) { try { onProgress(text); } catch (e) {} }
                        }
                    }
                }
                dlog(tag + ' 流式完 耗时' + ((Date.now() - t0) / 1000).toFixed(1) + '秒 长度=' + text.length);
                return text;
            } catch (e) {
                if (controller.signal.aborted) {
                    const te = new Error(got ? '吐字中途卡住' : (Math.round(firstMs / 1000) + '秒不吐字')); te._to = true; throw te;
                }
                throw e;
            } finally {
                clearTimeout(watchdog);
            }
        }

        // [MP] 流式/非流式 + 卡死重试 + 空回重试的统一入口
        async function vaultSummarize(sysPrompt, srcText, cfg, onProgress) {
            const useStream = cfg && cfg.stream !== false;
            const tries = 3;
            const token = await getCsrfToken();
            let lastMsg = '未知';
            for (let i = 0; i < tries; i++) {
                try {
                    const out = useStream
                        ? await vaultSummarizeStreamOnce(sysPrompt, srcText, cfg, token, 15000, 30000, onProgress, '流第' + (i + 1) + '发')
                        : await vaultSummarizeOnce(sysPrompt, srcText, cfg, token, 80000, '第' + (i + 1) + '发');
                    if (out && String(out).trim()) return out;
                    lastMsg = '空回'; // [MP] 200 但没正文，多半上游抽风，换一发
                    dlog('第' + (i + 1) + '发空回，换一发');
                    continue;
                } catch (e) {
                    if (e && e._to) { lastMsg = String(e.message || '卡死'); dlog('第' + (i + 1) + '发卡死(' + lastMsg + ')，换一发'); continue; }
                    throw e; // HTTP/CORS 这类硬错，重试也白搭，直接抛
                }
            }
            throw new Error('连着' + tries + '发都没成（' + lastMsg + '）：缩小区间，或换个渠道/切非流式再试');
        }

        function onSummaryResult(payload) {
            // [MP] 配对：只认当前在等的那一发；对不上（僵尸/过期回包）直接丢，不清状态不填框
            if (!payload || payload.reqId !== genReqId || genReqId === 0) {
                dlog('丢弃不匹配的 summary 回包 reqId=' + (payload && payload.reqId) + ' 期望=' + genReqId, true);
                return;
            }
            genReqId = 0;
            genPhase = null;
            clearGen();
            document.getElementById('btn-gen').disabled = false;
            if (!payload || typeof payload.text !== 'string') { document.getElementById('gen-stat').textContent = '返回为空'; return; }
            dlog('收到 summary 长度=' + payload.text.length);
            if (!payload.text.trim()) {
                document.getElementById('gen-stat').textContent = '副API返回空内容（模型没吐正文，多半被拒/过滤或思考模型）';
                dlog('summary 为空白', true);
                return;
            }
            pendingSummary = { rangeStart: payload.rangeStart, rangeEnd: payload.rangeEnd, text: payload.text };
            document.getElementById('sum-result').value = payload.text;
            document.getElementById('gen-stat').textContent = `已生成 ${payload.rangeStart}~${payload.rangeEnd}，可编辑`;
            document.getElementById('btn-save-summary').disabled = false;
            document.getElementById('btn-apply').disabled = false;
        }

        async function summariesForChat(chatKey) {
            if (!db) return [];
            const idx = tx('summaries', 'readonly').index('chatKey');
            const rows = await idbReq(idx.getAll(IDBKeyRange.only(chatKey)));
            rows.sort((a, b) => a.volume - b.volume);
            return rows;
        }

        // [MP] 入库一条总结，返回 {id, volume}；applied 标记是否已执行替换
        async function saveSummaryRow(text, rs, re, applied) {
            const existing = await summariesForChat(currentChatKey);
            const volume = (existing.reduce((mx, r) => Math.max(mx, r.volume || 0), 0)) + 1;
            const id = await idbReq(tx('summaries', 'readwrite').add({
                chatKey: currentChatKey,
                volume, rangeStart: rs, rangeEnd: re,
                summaryText: text, applied: !!applied,
                createdAt: new Date().toISOString(),
            }));
            return { id, volume };
        }

        let saveBusy = false; // [MP] 防手机连点重入
        document.getElementById('btn-save-summary').onclick = async () => {
            if (saveBusy) return;
            saveBusy = true;
            try {
                if (!currentChatKey) { toast('未定位聊天'); return; }
                const text = document.getElementById('sum-result').value.trim();
                if (!text) { toast('总结为空'); return; }
                const rs = parseInt(document.getElementById('sum-start').value, 10);
                const re = parseInt(document.getElementById('sum-end').value, 10);
                const { volume } = await saveSummaryRow(text, rs, re, false);
                toast(`已入库 第${volume}卷`);
                // [MP] 入库后清空总结框＋待存态，界面自己说话，不用盯着猜更没更新
                document.getElementById('sum-result').value = '';
                pendingSummary = null;
                document.getElementById('btn-save-summary').disabled = true;
                document.getElementById('btn-apply').disabled = true;
                document.getElementById('gen-stat').textContent = `已入库 第${volume}卷 ✓ 总结框已清空，可继续下一段`;
                await renderSummaryHistory();
            } finally { saveBusy = false; }
        };

        // [MP] 保存并执行替换隐藏：入库→发桥改真实存档→回执后标记 applied 并刷新
        let applyPending = null; // {id, volume, rs, re}
        let applyBusy = false; // [MP] 防手机连点重入：进函数先上锁
        document.getElementById('btn-apply').onclick = async () => {
            if (applyBusy) return;
            applyBusy = true;
            try {
                if (!bridgeOnline) { toast('桥离线，无法替换'); return; }
                if (!currentChatKey) { toast('未定位聊天'); return; }
                const text = document.getElementById('sum-result').value.trim();
                if (!text) { toast('总结为空，先生成'); return; }
                const rs = parseInt(document.getElementById('sum-start').value, 10);
                const re = parseInt(document.getElementById('sum-end').value, 10);
                if (!Number.isInteger(rs) || !Number.isInteger(re) || rs > re) { toast('区间非法'); return; }
                if (!confirm(
                    `确认执行替换隐藏？\n\n` +
                    `· ${rs}~${re} 楼将折叠为一条总结\n` +
                    `· 总结写成第 ${re} 楼的新版本\n` +
                    `· ${rs}~${re - 1} 楼将被隐藏，不再进提示词\n\n` +
                    `会改动酒馆真实存档，但可逆：随时点这一卷的【还原正文】即可一键撤销。`)) return;
                const { id, volume } = await saveSummaryRow(text, rs, re, false);
                document.getElementById('btn-apply').disabled = true;
                document.getElementById('gen-stat').textContent = `执行替换隐藏中… 第${volume}卷`;
                mpStart(`发 apply-replace ${rs}~${re} 第${volume}卷`);
                // [MP] 点击即刻本地刷新：用手里已有的数据当场把界面画成隐藏后的样子，
                // 不等桥回执。手机浏览器会把 iframe 事件循环节流到分钟级，等桥→iframe 的回执＝等分钟。
                // 同时记下回滚所需的原状，桥要是失败就把界面撤回去。
                let prevAnchor = null, hidNow = [];
                if (snapshot && Array.isArray(snapshot.messages)) {
                    for (let i = rs; i <= re - 1; i++) {
                        const mm = snapshot.messages[i];
                        if (mm && !mm.is_system) { mm.is_system = true; hidNow.push(i); }
                    }
                    const anchor = snapshot.messages[re];
                    if (anchor) {
                        if (!Array.isArray(anchor.swipes)) anchor.swipes = [anchor.mes || ''];
                        prevAnchor = { mes: anchor.mes, swipes: anchor.swipes.slice(), swipeId: anchor.swipeId };
                        const summaryMes = `【前文剧情总结·第${volume}卷】\n` + text;
                        anchor.swipes.push(summaryMes);
                        anchor.swipeId = anchor.swipes.length - 1;
                        anchor.mes = summaryMes;
                    }
                    await render();
                    mpMark('★本地即刻render完成（点击即变，不等桥）');
                }
                applyPending = { id, volume, rs, re, prevAnchor, hidNow };
                post('apply-replace', { rangeStart: rs, rangeEnd: re, summaryText: text, volume });
            } finally { applyBusy = false; }
        };

        async function onApplyResult(payload) {
            mpMark('★1 桥回执 apply-result 到手');
            document.getElementById('btn-apply').disabled = false;
            if (!payload || !payload.ok) {
                const m = payload && payload.message || '未知错误';
                toast('替换失败：' + m);
                document.getElementById('gen-stat').textContent = '替换失败：' + m;
                dlog('apply-replace 失败: ' + m, true);
                return;
            }
            // 标记该卷已替换，并存下还原所需的原文/隐藏楼
            if (applyPending && applyPending.id != null) {
                try {
                    const row = await idbReq(tx('summaries', 'readonly').get(applyPending.id));
                    if (row) {
                        row.applied = true;
                        row.revert = {
                            origMes: payload.origMes,
                            origSwipeId: payload.origSwipeId,
                            hiddenFloors: payload.hiddenFloors || [],
                        };
                        await idbReq(tx('summaries', 'readwrite').put(row));
                    }
                } catch (e) { dlog('标记 applied 失败: ' + (e && e.message || e), true); }
            }
            toast(`第${payload.volume}卷已替换隐藏`);
            document.getElementById('gen-stat').textContent = `第${payload.volume}卷已替换隐藏 ✓`;
            applyPending = null;
            // [MP] 就地更新：桥回执已带回「隐藏楼号 + 结束楼新正文」，本地快照直接改这两处→界面秒变。
            // 不再 post('get-snapshot')：那份「全楼层全版本全文」的巨型快照跨 iframe 序列化是分钟级黑洞，
            // 隐藏/替换根本不需要重拉整份，回执里的增量就够画全。
            if (snapshot && Array.isArray(snapshot.messages)) {
                for (const f of (payload.hiddenFloors || [])) {
                    if (snapshot.messages[f]) snapshot.messages[f].is_system = true;
                }
                const anchor = snapshot.messages[payload.rangeEnd];
                if (anchor && typeof payload.anchorMes === 'string') {
                    anchor.mes = payload.anchorMes;
                    if (Array.isArray(payload.anchorSwipes)) anchor.swipes = payload.anchorSwipes;
                    if (Number.isInteger(payload.anchorSwipeId)) anchor.swipeId = payload.anchorSwipeId;
                }
                await render();
                mpMark('★2 本地就地render完成（界面此刻已变，不再等快照）');
            }
            await renderSummaryHistory();
        }

        // [MP] 历史卡片按钮统一分发：执行替换 / 还原 / 删除
        let revertPending = null; // {id, volume}
        document.getElementById('sum-history').addEventListener('click', async (e) => {
            if (!e.target.closest) return;
            const applyBtn = e.target.closest('.mp-apply-saved');
            if (applyBtn) { const id = parseInt(applyBtn.getAttribute('data-id'), 10); if (Number.isInteger(id)) await applySavedSummary(id); return; }
            const revertBtn = e.target.closest('.mp-revert');
            if (revertBtn) { const id = parseInt(revertBtn.getAttribute('data-id'), 10); if (Number.isInteger(id)) await revertSummary(id); return; }
            const delBtn = e.target.closest('.mp-del-sum');
            if (delBtn) { const id = parseInt(delBtn.getAttribute('data-id'), 10); if (Number.isInteger(id)) await deleteSummary(id); return; }
        });

        // [MP] 把库里一条已保存的总结推到酒馆执行替换隐藏（刷新后仍可操作，走这条）
        async function applySavedSummary(id) {
            if (!bridgeOnline) { toast('桥离线，无法替换'); return; }
            const row = await idbReq(tx('summaries', 'readonly').get(id));
            if (!row) { toast('找不到该卷'); return; }
            if (row.applied) { toast('这卷已经替换过了'); return; }
            const rs = row.rangeStart, re = row.rangeEnd;
            if (!Number.isInteger(rs) || !Number.isInteger(re) || rs > re) { toast('这卷区间数据异常'); return; }
            if (!confirm(
                `确认执行替换隐藏？（第 ${row.volume} 卷）\n\n` +
                `· ${rs}~${re} 楼将折叠为一条总结\n` +
                `· 总结写成第 ${re} 楼的新版本\n` +
                `· ${rs}~${re - 1} 楼将被隐藏，不再进提示词\n\n` +
                `会改动酒馆真实存档，但可逆：随时点这一卷的【还原正文】即可一键撤销。`)) return;
            applyPending = { id: row.id, volume: row.volume, rs, re };
            dlog(`发 apply-replace(存档) ${rs}~${re} 第${row.volume}卷`);
            post('apply-replace', { rangeStart: rs, rangeEnd: re, summaryText: row.summaryText, volume: row.volume });
        }

        // [MP] 删除一条总结存档（只删蜜脾库，不动酒馆；已替换的提醒先还原）
        async function deleteSummary(id) {
            const row = await idbReq(tx('summaries', 'readonly').get(id));
            if (!row) { toast('找不到该卷'); return; }
            if (row.applied) {
                if (!confirm(`第 ${row.volume} 卷已替换到酒馆。\n删除只删蜜脾这条记录，酒馆里的折叠不会自动还原，且删后就没法再一键还原了。\n\n仍要删除吗？（建议先「还原正文」再删）`)) return;
            } else {
                if (!confirm(`删除第 ${row.volume} 卷总结记录？（只删蜜脾库，不动酒馆）`)) return;
            }
            await idbReq(tx('summaries', 'readwrite').delete(id));
            toast(`已删除第${row.volume}卷`);
            await renderSummaryHistory();
        }

        async function revertSummary(id) {
            if (!bridgeOnline) { toast('桥离线，无法还原'); return; }
            const row = await idbReq(tx('summaries', 'readonly').get(id));
            if (!row) { toast('找不到该卷'); return; }
            if (!row.revert) { toast('这条没有还原信息（旧数据），无法自动还原'); return; }
            if (!confirm(
                `确认还原第 ${row.volume} 卷？\n\n` +
                `· 第 ${row.rangeEnd} 楼恢复成原文\n` +
                `· ${row.rangeStart}~${row.rangeEnd - 1} 楼取消隐藏\n\n` +
                `会改动酒馆真实存档。`)) return;
            revertPending = { id, volume: row.volume };
            mpStart(`发 revert-replace 第${row.volume}卷 结束楼${row.rangeEnd}`);
            post('revert-replace', {
                rangeEnd: row.rangeEnd,
                volume: row.volume,
                origMes: row.revert.origMes,
                origSwipeId: row.revert.origSwipeId,
                hiddenFloors: row.revert.hiddenFloors || [],
            });
        }

        async function onRevertResult(payload) {
            mpMark('★1 桥回执 revert-result 到手');
            if (!payload || !payload.ok) {
                const m = payload && payload.message || '未知错误';
                toast('还原失败：' + m);
                dlog('revert-replace 失败: ' + m, true);
                return;
            }
            if (revertPending && revertPending.id != null) {
                try {
                    const row = await idbReq(tx('summaries', 'readonly').get(revertPending.id));
                    if (row) {
                        // [MP] 乐观更新：删掉还原信息前先抓出隐藏楼号，本地快照立刻取消这些楼的隐藏→界面秒变
                        const floors = (payload.hiddenFloors && payload.hiddenFloors.length)
                            ? payload.hiddenFloors
                            : ((row.revert && Array.isArray(row.revert.hiddenFloors)) ? row.revert.hiddenFloors : []);
                        if (snapshot && Array.isArray(snapshot.messages)) {
                            for (const f of floors) { if (snapshot.messages[f]) snapshot.messages[f].is_system = false; }
                            // [MP] 结束楼恢复原文：同样吃桥回执里的增量，不重拉整份快照
                            const anchor = snapshot.messages[payload.rangeEnd];
                            if (anchor && typeof payload.anchorMes === 'string') {
                                anchor.mes = payload.anchorMes;
                                if (Array.isArray(payload.anchorSwipes)) anchor.swipes = payload.anchorSwipes;
                                if (Number.isInteger(payload.anchorSwipeId)) anchor.swipeId = payload.anchorSwipeId;
                            }
                        }
                        row.applied = false; delete row.revert;
                        await idbReq(tx('summaries', 'readwrite').put(row));
                    }
                } catch (e) { dlog('清除 applied 失败: ' + (e && e.message || e), true); }
            }
            toast(`第${payload.volume}卷已还原`);
            revertPending = null;
            await render();            // [MP] 本地秒刷
            mpMark('★2 本地乐观render完成（界面此刻应已变）');
            await renderSummaryHistory();
            mpMark('★3 发 get-snapshot 兜底对账');
            post('get-snapshot');      // 后台兜底对账
        }

        async function renderSummaryHistory() {
            const box = document.getElementById('sum-history');
            box.innerHTML = '';
            if (!currentChatKey) return;
            const rows = await summariesForChat(currentChatKey);
            let lastEnd = -1;
            rows.forEach(r => {
                if (typeof r.rangeEnd === 'number') lastEnd = Math.max(lastEnd, r.rangeEnd);
                const div = document.createElement('div');
                div.className = 'sum-item';
                const actions =
                    (!r.applied ? ` <button class="mp-apply-saved" data-id="${r.id}">执行替换隐藏</button>` : '') +
                    (r.applied && r.revert ? ` <button class="mp-revert" data-id="${r.id}">还原正文</button>` : '') +
                    (r.applied && !r.revert ? ' <span class="floor-meta">（旧数据无还原信息）</span>' : '') +
                    ` <button class="mp-del-sum" data-id="${r.id}">删除</button>`;
                div.innerHTML =
                    `<div class="meta"><b>第${r.volume}卷</b> · ${r.rangeStart}~${r.rangeEnd}楼 · ${new Date(r.createdAt).toLocaleString()}` +
                    (r.applied ? ' <span class="applied">已替换</span>' : '') +
                    actions + '</div>' +
                    `<details class="sum-detail"><summary>${esc(textPrefix80(r.summaryText))}…（点开看全文）</summary>` +
                    `<div class="sum-full">${esc(r.summaryText)}</div></details>`;
                box.appendChild(div);
            });
            document.getElementById('lastvol').textContent = rows.length
                ? `已有${rows.length}卷，上一卷覆盖到 ${lastEnd}楼（仅参考）` : '暂无总结';
            // [MP] 总结集合变化（保存/替换/还原/快照）后，若注入开启则同步刷新注入
            if (injEnabled) { try { await refreshInjection(); } catch (e) { dlog('刷新注入失败: ' + (e && e.message || e), true); } }
        }

        // [MP] ============ 信息档案 + 注入（第3期）============
        let injEnabled = false, injPos = 1, injDepth = 4;   // 注入设置（全局，非按聊天）
        let codexReqId = 0, codexCfg = null, codexExistingDoc = '', codexTimer = null;

        async function loadCodexRecord(chatKey) {
            if (!db || !chatKey) return null;
            return await idbReq(tx('codex', 'readonly').get(chatKey));
        }

        async function renderCodex() {
            const ta = document.getElementById('codex-text');
            const rec = currentChatKey ? await loadCodexRecord(currentChatKey) : null;
            ta.value = (rec && rec.docText) ? rec.docText : '';
            document.getElementById('btn-codex-revert').disabled = !(rec && rec.prevDocText);
            document.getElementById('codex-meta').textContent = currentChatKey
                ? (rec ? `已存 · ${ta.value.length}字 · ${rec.updatedAt ? new Date(rec.updatedAt).toLocaleString() : ''}` : '本聊天暂无档案')
                : '未定位聊天';
        }

        // [MP] 存档案：keepPrev=true 时把当前库里的正文压进 prevDocText（供还原），只留一版
        async function saveCodexDoc(docText, keepPrev) {
            if (!currentChatKey) throw new Error('未定位聊天');
            const old = await loadCodexRecord(currentChatKey);
            const rec = {
                chatKey: currentChatKey,
                docText: String(docText != null ? docText : ''),
                updatedAt: new Date().toISOString(),
                prevDocText: keepPrev ? ((old && old.docText) || '') : ((old && old.prevDocText) || ''),
            };
            await idbReq(tx('codex', 'readwrite').put(rec));
            return rec;
        }

        // [MP] 最新一卷总结正文（更早卷已替换进楼层，不重复注入）
        async function latestSummaryText() {
            if (!currentChatKey) return '';
            const rows = await summariesForChat(currentChatKey);   // 已按卷号升序
            if (!rows.length) return '';
            const last = rows[rows.length - 1];
            return last ? String(last.summaryText || '') : '';
        }

        // [MP] 把「当前档案 + 最新一卷总结」推给桥去注入；关了就发 enabled:false 让桥清空
        async function refreshInjection() {
            if (!bridgeOnline) { document.getElementById('inj-stat').textContent = '桥离线，注入待桥上线'; return; }
            if (!injEnabled) { post('set-injection', { enabled: false }); return; }
            const codexText = document.getElementById('codex-text').value || '';
            const summaryText = await latestSummaryText();
            post('set-injection', {
                enabled: true, codexText, summaryText,
                position: Number(injPos), depth: Number(injDepth),
            });
        }

        // 注入开关/位置/深度
        document.getElementById('inj-enabled').onchange = async (e) => {
            injEnabled = e.target.checked;
            await putSetting('injEnabled', injEnabled);
            document.getElementById('inj-stat').textContent = injEnabled ? '注入开启，发送中…' : '注入已关闭';
            await refreshInjection();
            await updateInjectMarker();  // [MP] 开/关立刻在正文区显/隐落点线
        };
        document.getElementById('inj-pos').onchange = async (e) => {
            injPos = parseInt(e.target.value, 10); await putSetting('injPos', injPos);
            if (injEnabled) await refreshInjection();
            await updateInjectMarker();
        };
        document.getElementById('inj-depth').onchange = async (e) => {
            injDepth = parseInt(e.target.value, 10) || 0; await putSetting('injDepth', injDepth);
            if (injEnabled) await refreshInjection();
            await updateInjectMarker();
        };

        // 保存档案（手动编辑后）
        let codexSaveBusy = false;
        document.getElementById('btn-codex-save').onclick = async () => {
            if (codexSaveBusy) return; codexSaveBusy = true;
            try {
                if (!currentChatKey) { toast('未定位聊天'); return; }
                await saveCodexDoc(document.getElementById('codex-text').value, true);
                toast('档案已保存');
                await renderCodex();
                if (injEnabled) await refreshInjection();
            } catch (e) { toast('保存失败: ' + (e && e.message || e)); dlog('存档案失败: ' + (e && e.message || e), true); }
            finally { codexSaveBusy = false; }
        };

        // 还原上一版（与当前互换，可来回切）
        document.getElementById('btn-codex-revert').onclick = async () => {
            if (!currentChatKey) { toast('未定位聊天'); return; }
            const rec = await loadCodexRecord(currentChatKey);
            if (!rec || !rec.prevDocText) { toast('没有可还原的上一版'); return; }
            const restored = {
                chatKey: currentChatKey, docText: rec.prevDocText,
                updatedAt: new Date().toISOString(), prevDocText: rec.docText,
            };
            await idbReq(tx('codex', 'readwrite').put(restored));
            toast('已还原到上一版');
            await renderCodex();
            if (injEnabled) await refreshInjection();
        };

        // AI更新档案：两阶段，跟总结同一条路（桥取原文→前台直发副API），长请求不被手机冻
        document.getElementById('btn-codex-gen').onclick = () => {
            if (codexReqId !== 0) { toast('档案更新已在进行，等它回来或超时'); return; }
            if (!bridgeOnline) { toast('桥离线，无法取原文'); return; }
            const rs = parseInt(document.getElementById('codex-start').value, 10);
            const re = parseInt(document.getElementById('codex-end').value, 10);
            if (!Number.isInteger(rs) || !Number.isInteger(re) || rs > re) { toast('区间非法'); return; }
            const cfg = apiConfigFromUI();
            if (!cfg.apiurl || !cfg.model) { toast('先填副API设置(apiurl/model)'); setView('v-settings'); return; }
            const reqId = ++genReqSeq;
            codexReqId = reqId; codexCfg = cfg;
            codexExistingDoc = document.getElementById('codex-text').value || '';
            document.getElementById('btn-codex-gen').disabled = true;
            document.getElementById('codex-stat').textContent = '取原文中…（问桥要区间文本，1秒内该回）';
            if (codexTimer) clearTimeout(codexTimer);
            codexTimer = setTimeout(() => {
                if (codexReqId !== reqId) return;
                codexReqId = 0; document.getElementById('btn-codex-gen').disabled = false;
                document.getElementById('codex-stat').textContent = '桥没回原文（酒馆标签页可能被冻）：切回酒馆停一下再回来重点';
                dlog('codex get-range-text 20秒没回，疑似桥被冻', true);
            }, 20000);
            dlog(`发 get-range-text(codex) ${rs}~${re} #${reqId}`);
            post('get-range-text', { reqId, rangeStart: rs, rangeEnd: re });
        };

        // 档案的第二阶段：原文回来，前台直发副API更新档案（流式实时写进档案框）
        async function onCodexRangeText(payload) {
            const reqId = payload.reqId;
            if (codexTimer) { clearTimeout(codexTimer); codexTimer = null; }
            if (payload.ok === false) {
                codexReqId = 0; document.getElementById('btn-codex-gen').disabled = false;
                document.getElementById('codex-stat').textContent = '取原文失败：' + (payload.message || '未知');
                return;
            }
            const useStream = codexCfg && codexCfg.stream !== false;
            const userText = '【现有档案】\n' + (codexExistingDoc || '（暂无，请按分节新建）')
                + '\n\n【新增区间原文】\n' + (payload.text || '');
            const ta = document.getElementById('codex-text');
            let onProgress = null;
            if (useStream) {
                document.getElementById('codex-stat').textContent = '生成中…（流式·实时写入下方档案框）';
                ta.value = '';
                onProgress = (txt) => {
                    if (codexReqId !== reqId) return;
                    const s = String(txt || ''); ta.value = s; ta.scrollTop = ta.scrollHeight;
                    document.getElementById('codex-stat').textContent = `生成中… 已收 ${s.length} 字`;
                };
            } else {
                document.getElementById('codex-stat').textContent = '生成中…（非流式，卡了自动重试）';
            }
            try {
                const codexPrompt = document.getElementById('s-codex-prompt').value || DEFAULT_CODEX_PROMPT;
                const text = await vaultSummarize(codexPrompt, userText, codexCfg, onProgress);
                if (codexReqId !== reqId) { dlog('档案回来但已不是当前请求，丢弃 #' + reqId, true); return; }
                codexReqId = 0; document.getElementById('btn-codex-gen').disabled = false;
                if (!text || !text.trim()) {
                    document.getElementById('codex-stat').textContent = '副API返回空内容（多半被拒/过滤或思考模型）';
                    // 空回时把原档案填回去，别把框清没了
                    await renderCodex();
                    return;
                }
                ta.value = text;
                await saveCodexDoc(text, true);      // 旧版压进 prevDocText
                await renderCodex();
                document.getElementById('codex-stat').textContent = '档案已更新并入库 ✓ 可再编辑后保存';
                if (injEnabled) await refreshInjection();
            } catch (e) {
                if (codexReqId !== reqId) { dlog('档案失败但已不是当前请求，忽略 #' + reqId, true); return; }
                codexReqId = 0; document.getElementById('btn-codex-gen').disabled = false;
                document.getElementById('codex-stat').textContent = '生成失败：' + (e && e.message || e);
                toast('档案更新失败: ' + (e && e.message || e));
            }
        }

        // [MP] ============ 渲染 ============
        function esc(s) { return String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

        function renderMd(text) {
            if (window.marked && typeof window.marked.parse === 'function') {
                try { return { html: window.marked.parse(text || ''), plain: false }; } catch (e) { /* fall through */ }
            }
            return { html: esc(text || ''), plain: true };
        }

        function textPrefix80(s) { return String(s || '').slice(0, 80); }

        // 存档指纹匹配：优先 floorIndex+swipeIndex，其次 sendDate+textPrefix
        function isArchived(saved, floorIndex, swipeIndex, sendDate, swipeText) {
            const pfx = textPrefix80(swipeText);
            return saved.some(r =>
                (r.floorIndex === floorIndex && r.swipeIndex === swipeIndex) ||
                (r.sendDate && sendDate && r.sendDate === sendDate && r.textPrefix === pfx)
            );
        }

        async function render() {
            const main = document.getElementById('main');
            if (!snapshot || !snapshot.messages || !snapshot.messages.length) {
                main.innerHTML = '<div class="empty">当前聊天没有可显示的楼层</div>';
                document.getElementById('stat').textContent = '';
                return;
            }
            const saved = await proseForChat(snapshot.chatKey);
            const fAI = document.getElementById('f-ai').checked;
            const fSaved = document.getElementById('f-saved').checked;
            const kw = document.getElementById('f-kw').value.trim().toLowerCase();

            let shown = 0;
            const frag = document.createDocumentFragment();

            for (const m of snapshot.messages) {
                if (fAI && m.is_user) continue;
                const swipes = m.swipes && m.swipes.length ? m.swipes : [m.mes];
                const floorSaved = swipes.some((t, si) => isArchived(saved, m.floorIndex, si, m.sendDate, t));
                if (fSaved && !floorSaved) continue;
                if (kw) {
                    const hit = swipes.some(t => String(t).toLowerCase().includes(kw));
                    if (!hit) continue;
                }
                shown++;

                const floor = document.createElement('div');
                floor.className = 'floor';
                floor.dataset.floor = m.floorIndex;  // [MP] 供注入标记线定位

                const head = document.createElement('div');
                head.className = 'floor-head';
                const roleBadge = m.is_user ? '<span class="badge user">你</span>' : '<span class="badge ai">AI</span>';
                const hiddenBadge = m.is_system ? '<span class="badge hidden">隐藏</span>' : '';
                const verInfo = swipes.length > 1 ? `${swipes.length}版本` : '单版本';
                head.innerHTML =
                    roleBadge + hiddenBadge +
                    `<span class="floor-meta">${m.floorIndex}楼 · ${esc(m.name)} · ${verInfo}</span>` +
                    `<span class="floor-preview">${esc(textPrefix80(m.mes))}</span>`;
                floor.appendChild(head);

                const box = document.createElement('div');
                box.className = 'swipes';
                floor.appendChild(box);

                // [MP] 懒渲染：折叠态不解析 markdown、不建 DOM；点开哪一楼才现场建那一楼，
                // 避免打开面板时把全聊天几百个版本一次性 marked.parse 堆爆主线程→高延迟。
                let built = false;
                const buildSwipes = () => {
                    if (built) return; built = true;
                    swipes.forEach((t, si) => {
                        const sw = document.createElement('div');
                        sw.className = 'swipe';
                        const chosen = si === m.swipeId;
                        const arch = isArchived(saved, m.floorIndex, si, m.sendDate, t);

                        const bar = document.createElement('div');
                        bar.className = 'swipe-bar';
                        bar.innerHTML =
                            `<span class="path-label">${m.floorIndex}楼 · 版本${si}</span>` +
                            (chosen ? '<span class="chosen-tag">当前采用</span>' : '') +
                            (arch ? '<span class="saved-tag">已存档</span>' : '');
                        const btn = document.createElement('button');
                        btn.textContent = arch ? '再存一份' : '存档';
                        btn.onclick = () => archiveSwipe(m, si, t, chosen);
                        bar.appendChild(btn);
                        sw.appendChild(bar);

                        const body = document.createElement('div');
                        const r = renderMd(t);
                        body.className = 'swipe-body' + (r.plain ? ' plain' : '');
                        body.innerHTML = r.html;
                        sw.appendChild(body);
                        box.appendChild(sw);
                    });
                };
                head.onclick = () => {
                    if (!floor.classList.contains('open')) buildSwipes();
                    floor.classList.toggle('open');
                };
                frag.appendChild(floor);
            }

            main.innerHTML = '';
            if (!shown) main.innerHTML = '<div class="empty">没有符合筛选条件的楼层</div>';
            else main.appendChild(frag);
            document.getElementById('stat').textContent = `共${snapshot.count}楼，显示${shown}，已存档${saved.length}条`;
            await updateInjectMarker();  // [MP] 画注入落点
        }

        // [MP] 算注入落点：位置=最前→top；深度0→垫最后一楼下面；深度D→从底数第D可见楼上方
        function computeInjectTarget() {
            if (!injEnabled || !snapshot || !snapshot.messages) return null;
            const vis = snapshot.messages.filter(m => !m.is_system);  // 隐藏楼不进上下文，不计数
            const n = vis.length;
            if (Number(injPos) === 0) return { mode: 'top' };
            const D = Number(injDepth) || 0;
            if (D <= 0) return { mode: 'bottom' };
            const idx = n - D;
            if (idx <= 0) return { mode: 'top' };
            if (idx >= n) return { mode: 'bottom' };
            return { mode: 'before', floorIndex: vis[idx].floorIndex, below: D };
        }

        async function buildInjectMarkerEl(target) {
            const rec = currentChatKey ? await loadCodexRecord(currentChatKey) : null;
            const codexText = ((rec && rec.docText) || '').trim();
            const sumText = (await latestSummaryText() || '').trim();
            const combined = [codexText, sumText].filter(Boolean).join('\n\n');
            let where;
            if (target.mode === 'top') where = '插在所有聊天最前面（#0楼之前）';
            else if (target.mode === 'bottom') where = '垫在最后一楼下面（深度0）';
            else where = `插在第${target.floorIndex}楼上方 · 它下面还有${target.below}个可见楼（深度${injDepth}）`;
            const bits = [];
            if (codexText) bits.push('档案 ' + codexText.length + '字');
            if (sumText) bits.push('最新卷总结 ' + sumText.length + '字');
            const load = bits.length ? bits.join(' + ') : '档案和总结都为空，实际注入是空的';
            const el = document.createElement('div');
            el.className = 'inject-marker';
            el.innerHTML =
                `<div class="im-head">✦ 蜜脾注入落点 · ${where}</div>` +
                `<div class="im-sub">装的内容：${load}</div>` +
                `<details class="im-detail"><summary>点开看注进去的原文</summary><div class="im-full"></div></details>`;
            el.querySelector('.im-full').textContent = combined || '（空）';
            return el;
        }

        async function updateInjectMarker() {
            const main = document.getElementById('main');
            if (!main) return;
            main.querySelectorAll('.inject-marker').forEach(e => e.remove());
            const target = computeInjectTarget();
            if (!target) return;
            const marker = await buildInjectMarkerEl(target);
            if (target.mode === 'top') { main.insertBefore(marker, main.firstChild); return; }
            if (target.mode === 'bottom') { main.appendChild(marker); return; }
            let ref = null;
            main.querySelectorAll('.floor').forEach(f => { if (!ref && f.dataset.floor === String(target.floorIndex)) ref = f; });
            if (ref) main.insertBefore(marker, ref);
            else { marker.querySelector('.im-head').textContent += '（该楼当前被筛选，标记暂置顶）'; main.insertBefore(marker, main.firstChild); }
        }

        async function archiveSwipe(m, swipeIndex, text, isChosen) {
            try {
                await addProse({
                    chatKey: snapshot.chatKey,
                    floorIndex: m.floorIndex,
                    swipeIndex: swipeIndex,
                    isChosen: !!isChosen,
                    sendDate: m.sendDate || null,
                    textPrefix: textPrefix80(text),
                    content: text,
                    savedAt: new Date().toISOString(),
                    note: '',
                });
                toast(`已存档 ${m.floorIndex}楼·版本${swipeIndex}`);
                await render();
            } catch (e) {
                toast('存档失败: ' + (e && e.message || e));
            }
        }

        ['f-ai', 'f-saved'].forEach(id => document.getElementById(id).onchange = render);
        document.getElementById('f-kw').oninput = () => { clearTimeout(window.__kwT); window.__kwT = setTimeout(render, 200); };

        // [MP] ============ 正文存档清单：核对存档↔酒馆对应 ============
        // 给一条存档去当前快照里认位置，返回 {status, floor, swipe}
        //   exact  = 原位在、内容一致
        //   moved  = 指纹(时间戳+开头)在别处/别版本命中，位置变了
        //   edited = 原楼原版本还在、但正文被改过（对不上开头，也没在别处找到）
        //   orphan = 全聊天都找不到（源楼多半从底部被删了）
        function locateProse(rec, messages) {
            if (!messages || !messages.length) return { status: 'unknown' };
            const pfx = rec.textPrefix || textPrefix80(rec.content);
            const swOf = (m) => (m.swipes && m.swipes.length ? m.swipes : [m.mes]);
            // 1) 原位精确
            const at = messages[rec.floorIndex];
            if (at) {
                const sw = swOf(at);
                const t = sw[rec.swipeIndex];
                if (t != null && textPrefix80(t) === pfx) return { status: 'exact', floor: rec.floorIndex, swipe: rec.swipeIndex };
            }
            // 2) 指纹全局找（时间戳一致 或 落回同楼号），开头对上即命中
            for (const m of messages) {
                const dateOk = rec.sendDate && m.sendDate && rec.sendDate === m.sendDate;
                if (!dateOk && m.floorIndex !== rec.floorIndex) continue;
                const sw = swOf(m);
                for (let si = 0; si < sw.length; si++) {
                    if (textPrefix80(sw[si]) === pfx) return { status: 'moved', floor: m.floorIndex, swipe: si };
                }
            }
            // 3) 原楼原版本槽还在，但正文改了
            if (at && swOf(at)[rec.swipeIndex] != null) return { status: 'edited', floor: rec.floorIndex, swipe: rec.swipeIndex };
            // 4) 彻底找不到
            return { status: 'orphan' };
        }

        const PROSE_STATUS_TXT = {
            exact: (r) => `对上 · 第${r.floor}楼·版本${r.swipe} · 内容一致`,
            moved: (r) => `位置变了 · 现在在 第${r.floor}楼·版本${r.swipe}`,
            edited: (r) => `同楼正文改过 · 第${r.floor}楼·版本${r.swipe}`,
            orphan: () => `对不上 · 源楼已不在（孤儿）`,
            unknown: () => `未核对 · 先刷新快照`,
        };

        // [MP] 扫三库，按聊天汇总每个聊天各自存了多少
        async function allArchiveKeys() {
            if (!db) return [];
            const prose = await idbReq(tx('prose', 'readonly').getAll());
            const sums = await idbReq(tx('summaries', 'readonly').getAll());
            const codex = await idbReq(tx('codex', 'readonly').getAll());
            const map = new Map();
            const get = (k) => { if (!map.has(k)) map.set(k, { chatKey: k, prose: 0, vols: 0, codex: false }); return map.get(k); };
            prose.forEach(r => { if (r.chatKey) get(r.chatKey).prose++; });
            sums.forEach(r => { if (r.chatKey) get(r.chatKey).vols++; });
            codex.forEach(r => { if (r.chatKey && (r.docText || '').trim()) get(r.chatKey).codex = true; });
            return Array.from(map.values()).sort((a, b) => a.chatKey.localeCompare(b.chatKey));
        }

        async function renderArchiveOverview() {
            const wrap = document.getElementById('archive-overview');
            if (!wrap) return;
            const list = await allArchiveKeys();
            wrap.innerHTML = '';
            if (!list.length) { wrap.innerHTML = '<div class="empty">还没有任何聊天存过档</div>'; return; }
            list.forEach(rec => {
                const cur = rec.chatKey === currentChatKey;
                const row = document.createElement('div');
                row.className = 'arc-row' + (cur ? ' cur' : '');
                const bits = [];
                bits.push(`正文 ${rec.prose}`);
                bits.push(`总结 ${rec.vols}卷`);
                bits.push(rec.codex ? '有档案' : '无档案');
                row.innerHTML =
                    `<span class="arc-name">${cur ? '▶ ' : ''}${esc(rec.chatKey)}</span>` +
                    `<span class="arc-bits floor-meta">${bits.join(' · ')}${cur ? ' · 正在看' : ''}</span>`;
                wrap.appendChild(row);
            });
        }

        async function renderProseList() {
            const wrap = document.getElementById('prose-list');
            const meta = document.getElementById('prose-meta');
            if (!currentChatKey) { wrap.innerHTML = '<div class="empty">未定位聊天</div>'; meta.textContent = ''; return; }
            const rows = await proseForChat(currentChatKey);
            rows.sort((a, b) => (a.floorIndex - b.floorIndex) || (a.swipeIndex - b.swipeIndex) || (a.id - b.id));
            const messages = (snapshot && snapshot.messages) ? snapshot.messages : null;
            let orphan = 0, drift = 0;
            wrap.innerHTML = '';
            if (!rows.length) { wrap.innerHTML = '<div class="empty">这个聊天还没存过正文</div>'; meta.textContent = ''; return; }
            rows.forEach(rec => {
                const loc = locateProse(rec, messages);
                if (loc.status === 'orphan') orphan++;
                if (loc.status === 'moved' || loc.status === 'edited') drift++;
                const row = document.createElement('div');
                row.className = 'prose-row';
                const statTxt = (PROSE_STATUS_TXT[loc.status] || PROSE_STATUS_TXT.unknown)(loc);
                const head = document.createElement('div');
                head.className = 'pr-head';
                head.innerHTML =
                    `<span class="pi ${loc.status}">${statTxt}</span>` +
                    `<span class="floor-meta">存于 ${rec.floorIndex}楼·版本${rec.swipeIndex}${rec.isChosen ? '·存时采用' : ''} · ${rec.savedAt ? new Date(rec.savedAt).toLocaleString() : ''}</span>` +
                    `<span class="spacer"></span>`;
                const btnView = document.createElement('button');
                btnView.textContent = '看正文';
                const btnDel = document.createElement('button');
                btnDel.textContent = '删除';
                head.appendChild(btnView); head.appendChild(btnDel);
                row.appendChild(head);
                const prev = document.createElement('div');
                prev.className = 'pr-prev';
                prev.textContent = textPrefix80(rec.content) + '…';
                row.appendChild(prev);
                const full = document.createElement('div');
                full.className = 'pr-full'; full.style.display = 'none';
                full.textContent = rec.content || '';
                row.appendChild(full);
                btnView.onclick = () => {
                    const open = full.style.display !== 'none';
                    full.style.display = open ? 'none' : 'block';
                    btnView.textContent = open ? '看正文' : '收起正文';
                };
                btnDel.onclick = async () => {
                    if (!confirm(`删除这条存档？（存于${rec.floorIndex}楼·版本${rec.swipeIndex}）\n只删蜜脾相册里的这张照片，不动酒馆。`)) return;
                    try { await delProse(rec.id); toast('已删除该存档'); await renderProseList(); await render(); }
                    catch (e) { toast('删除失败: ' + (e && e.message || e)); }
                };
                wrap.appendChild(row);
            });
            meta.textContent = `共${rows.length}条` +
                (messages ? `（位置变/改过 ${drift}，孤儿 ${orphan}）` : '（先刷新快照才能核对位置）');
        }

        function proseListOpen() { return document.getElementById('v-overview').classList.contains('active'); }

        // [MP] ============ 侧边栏 / 视图切换 ============
        const VIEW_TITLES = { 'v-text': '正文', 'v-sum': '总结', 'v-codex': '信息档案', 'v-overview': '存档总览', 'v-settings': '副API设置' };
        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('overlay').classList.remove('show');
        }
        async function setView(name) {
            document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === name));
            document.querySelectorAll('.nav-item[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === name));

        };
        document.getElementById('overlay').onclick = closeSidebar;
        document.querySelectorAll('.nav-item[data-view]').forEach(b => b.onclick = () => setView(b.dataset.view));
        // [MP] 齿轮展开/收起工具组
        document.getElementById('btn-tools').onclick = () => document.getElementById('tools-group').classList.toggle('show');

        // [MP-美化] ============ 外观（主题） ============
        // 新增主题：往 MP_THEMES 加一行 + 在 <style> 里补一段 :root[data-theme="key"]{...} 色板即可
        const MP_THEMES = [
            { key: 'honey',    name: '蜜金', swatch: ['#151518', '#d4a03a', '#e8c06a', '#8a6cd0'] },
            { key: 'platinum', name: '白金', swatch: ['#e8eaef', '#707892', '#4a5468', '#6f52c0'] },
        ];
        function currentTheme() { try { return localStorage.getItem('mp_theme') || 'honey'; } catch (e) { return 'honey'; } }
        function applyTheme(key) {
            if (!key || key === 'honey') document.documentElement.removeAttribute('data-theme');
            else document.documentElement.setAttribute('data-theme', key);
            try { localStorage.setItem('mp_theme', key || 'honey'); } catch (e) {}
        }
        function renderThemeGrid() {

                `<button class="theme-card${t.key === cur ? ' active' : ''}" data-theme-key="${t.key}">` +

        document.getElementById('theme-close').onclick = closeThemeModal;
        document.getElementById('theme-modal').onclick = (e) => { if (e.target.id === 'theme-modal') closeThemeModal(); };

        // [MP] ============ 导出 / 导入 ============
        document.getElementById('btn-export').onclick = async () => {
            const data = {
                app: 'mellarium',
                version: 1,
                exportedAt: new Date().toISOString(),
                prose: await getAll('prose'),
                summaries: await getAll('summaries'),
                codex: await getAll('codex'),
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const d = new Date().toISOString().slice(0, 10);

        document.getElementById('btn-import').onclick = () => document.getElementById('file-import').click();
        document.getElementById('file-import').onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            try {
                const data = JSON.parse(await file.text());
                if (data.app !== 'mellarium') { toast('不是蜜脾导出文件'); return; }
                const n = (data.prose || []).length + (data.summaries || []).length + (data.codex || []).length;
                if (!confirm(`导入 ${n} 条记录？\nprose/summaries 追加，codex 按聊天覆盖。`)) return;
                for (const r of (data.prose || [])) { delete r.id; await idbReq(tx('prose', 'readwrite').add(r)); }
                for (const r of (data.summaries || [])) { delete r.id; await idbReq(tx('summaries', 'readwrite').add(r)); }
                for (const r of (data.codex || [])) { await idbReq(tx('codex', 'readwrite').put(r)); }
                toast(`已导入 ${n} 条`);
                await render();
            } catch (err) {
                toast('导入失败: ' + (err && err.message || err));
            } finally {
                e.target.value = '';
            }
        };

        // [MP] ============ toast ============
        let toastT = null;
        function toast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            if (toastT) clearTimeout(toastT);
            toastT = setTimeout(() => el.classList.remove('show'), 2200);
        }

        // [MP] ============ 启动 ============
        (async function init() {
            dlog('vault启动，marked=' + (!!window.marked));
            try { db = await openDB(); dlog('IndexedDB已打开'); } catch (e) { toast('IndexedDB 打开失败: ' + e); dlog('IndexedDB打开失败: ' + e, true); }
            try { await loadSettings(); dlog('设置已载入'); } catch (e) { dlog('设置载入失败: ' + e, true); }
            post('cancel-inflight'); // [MP] 先掐掉上次刷新前挂着的僵尸副API请求，再开工
            post('ping');
            dlog('已发ping，等桥应答');
            heartbeat();
        })();
    </script>
</body>

</html>
